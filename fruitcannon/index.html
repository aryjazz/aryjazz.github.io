<script>
// One link for every bio: phones go straight to their store, everything else
// sees both buttons. ?src=tiktok (or any name) rides into Play's install
// referrer, so Play Console and Firebase can tell which bio sent the install.
(function () {
  var PLAY = "https://play.google.com/store/apps/details?id=com.cosmickite.bbgame";
  var APPLE = "https://apps.apple.com/app/id6800754602";
  var src = new URLSearchParams(location.search).get("src");
  if (src && /^[a-z0-9_-]{1,30}$/i.test(src)) {
    PLAY += "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=social");
  }
  window.STORE = { play: PLAY, apple: APPLE };
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS reports as a Mac
  if (ios) location.replace(APPLE);
  else if (/Android/.test(ua)) location.replace(PLAY);
})();
</script>

  .icon { margin-top: -56px; border: 4px solid #fff; position: relative; }
  .actions { max-width: 380px; margin: 0 auto; }
  .icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
